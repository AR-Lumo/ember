<style>
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    background: #08131b;
    color: #e3f2f8;
    font-family: "Source Sans 3", system-ui, sans-serif;
    /* Content sits inside a safe area; some feeds crop the edges. */
    padding: 62px 72px;
    display: flex; flex-direction: column; justify-content: space-between;
    position: relative;
  }
  /* A single warm bloom, bottom-right, so the card is not a flat rectangle. */
  .glow {
    position: absolute; right: -180px; bottom: -240px;
    width: 700px; height: 700px; border-radius: 50%;
    background: radial-gradient(circle, rgba(34,211,238,.16) 0%, rgba(34,211,238,0) 68%);
  }
  .top { display: flex; align-items: center; gap: 26px; position: relative; }
  .name {
    font-family: "Sora", system-ui, sans-serif;
    font-weight: 800; font-size: 86px; letter-spacing: -.035em; line-height: 1;
  }
  .line { position: relative; }
  .tagline {
    font-family: "Sora", system-ui, sans-serif;
    font-weight: 600; font-size: 46px; line-height: 1.14;
    letter-spacing: -.02em; max-width: 21ch;
  }
  .tagline em { font-style: normal; color: #22d3ee; }
  .sub { margin-top: 18px; font-size: 25px; color: #a3c0cd; max-width: 46ch; }

  .code {
    position: relative;
    background: #050e14; border: 1px solid #1c3341; border-radius: 12px;
    padding: 22px 26px;
    font-family: "JetBrains Mono", monospace; font-size: 21px; line-height: 1.55;
    white-space: pre;
  }
  .k { color: #7dd3fc; } .t { color: #a5b4fc; } .s { color: #5eead4; }
  .e { color: #fda4af; font-weight: 700; } .n { color: #93a7c7; } .u { color: #fca5a5; }
</style>
