  <!--
    Explicit ink rather than `currentColor`: an SVG embedded with <img>
    does not inherit colour from the page, so a README in dark mode
    would render this black on black. The dark-ground twin is
    cinder-wordmark.svg, chosen with <picture>.
  -->
  <text x="76" y="44"
        font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Inter, sans-serif"
        font-size="38" font-weight="650" letter-spacing="-0.5" fill="#f2e9e1">Cinder</text>
</svg>
