<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 64" width="260" height="64"
     role="img" aria-label="Cinder">
  <title>Cinder</title>
  <defs>
    <linearGradient id="wmCoal" x1="12" y1="6" x2="52" y2="58" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#44231b"/>
      <stop offset="0.5" stop-color="#26140f"/>
      <stop offset="1" stop-color="#140a08"/>
    </linearGradient>
    <radialGradient id="wmHeat" cx="30" cy="33" r="20" gradientUnits="userSpaceOnUse">
