<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64"
     role="img" aria-label="Soliton">
  <title>Soliton</title>
  <defs>
    <linearGradient id="solPulse" x1="38" y1="11.0" x2="38" y2="46.0"
                    gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7dd3fc"/>
      <stop offset="0.45" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#0e7490"/>
    </linearGradient>
    <clipPath id="solClip"><rect x="0" y="0" width="64" height="46.0"/></clipPath>
    <!-- The echo is cut by the frame edge; without this fade that cut is
         a hard vertical wall and reads as a rendering fault rather than
         as something that arrived from off-frame. -->
    <linearGradient id="solFade" x1="0" y1="0" x2="30" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0.42"/>
    </linearGradient>
  </defs>

  <!--
    The trailing copy: the same curve, one wavelength back. A soliton
    keeps its shape as it travels, so the mark shows the shape twice
    rather than showing a wave dispersing.
  -->
