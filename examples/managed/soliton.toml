# A package. `soliton build`, `run` and `check` find this by walking up
# from the source file, resolve what it depends on, and put each
# dependency's `src` on the module search path.

[package]
name = "managed"
version = "0.1.0"

[dependencies]
# A path dependency: a directory on this machine, relative to this file.
# Nothing is fetched, and there is nothing to lock — it is whatever is
# in the directory right now.
textkit = { path = "textkit" }

# A git dependency would look like this, and would need a revision:
#
#   httpkit = { git = "https://example.invalid/httpkit", rev = "v1.2.0" }
#
# The commit it resolves to is written to `soliton.lock`, so asking for a
# branch still gets you the same code tomorrow.
