<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64"
     role="img" aria-label="Cinder">
  <title>Cinder</title>
  <defs>
    <!-- Spent coal: nearly black, with the last warmth at the edges. -->
    <linearGradient id="cinderCoal" x1="12" y1="6" x2="52" y2="58" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#44231b"/>
      <stop offset="0.5" stop-color="#26140f"/>
      <stop offset="1" stop-color="#140a08"/>
    </linearGradient>
    <!-- What is still burning underneath, seen through the break. -->
    <radialGradient id="cinderHeat" cx="30" cy="33" r="20" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fffbeb"/>
      <stop offset="0.3" stop-color="#fde047"/>
      <stop offset="0.65" stop-color="#f97316"/>
      <stop offset="1" stop-color="#dc2626"/>
    </radialGradient>
  </defs>

  <!--
    A cinder is a fragment that has mostly gone out, still burning where
    it cracked. So: a dark, irregular chip with heat showing through a
    torn opening.
    Earlier attempts were a flame (which is the fire, not what is left of
    it) and a faceted solid (which read as a box). The tear is
    deliberately lopsided - symmetry is what made the facets look
    manufactured.
  -->
  <path d="M30 3 L53 14 L58 34 L47 55 L26 61 L8 47 L4 24 Z" fill="url(#cinderCoal)"/>

  <!-- Halo, so the opening reads as light rather than a hole. -->
  <path d="M28 11 L44 21 L40 34 L46 46 L27 52 L15 41 L18 25 Z"
        fill="#f97316" opacity="0.25"/>

  <!-- The break itself. -->
  <path d="M29 15 L41 23 L36 33 L42 44 L27 48 L19 39 L22 26 Z"
        fill="url(#cinderHeat)"/>

  <!-- A splinter of coal lying across the opening: this is what stops
       the shape reading as a plain glowing blob. -->
  <path d="M24 17 L34 32 L28 34 L33 47 L23 33 L29 31 Z"
        fill="#1c0f0b" opacity="0.85"/>
</svg>
